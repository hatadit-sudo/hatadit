name: Build and test Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fjordwatch-android
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original art and audio
        run: |
          python -m pip install Pillow==11.3.0
          python tools/make_assets.py
          mkdir -p build
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/4.4.1.stable
          key: godot-4.4.1-linux-android-v1
      - name: Install pinned Godot engine
        run: |
          mkdir -p ~/.local/bin
          if [ ! -x ~/.local/bin/godot ]; then
            curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
            unzip -q /tmp/godot.zip -d /tmp/godot
            install /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 ~/.local/bin/godot
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Parse and test actual Godot game
        run: bash tools/check.sh
      - name: Capture actual game frames
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          LIBGL_ALWAYS_SOFTWARE=1 timeout 120s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/test_scene.gd -- --capture 2>&1 | tee build/render.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|^ERROR:|^FAIL:' build/render.log; then exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android export dependencies
        run: |
          sdkmanager 'platform-tools' 'build-tools;34.0.0' 'platforms;android-34'
          if [ ! -f ~/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk ]; then
            curl --fail --location --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
            unzip -q /tmp/templates.tpz -d /tmp/export-templates
            mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
            cp /tmp/export-templates/templates/* ~/.local/share/godot/export_templates/4.4.1.stable/
          fi
      - name: Configure Android export
        run: |
          mkdir -p ~/.config/godot ~/.android build
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          sdk=os.environ['ANDROID_HOME']
          java=os.environ['JAVA_HOME']
          path=Path.home()/'.config/godot/editor_settings-4.4.tres'
          path.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "'+sdk+'"\nexport/android/java_sdk_path = "'+java+'"\n')
          PY
      - name: Export ARM64 debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: godot --headless --path . --export-debug 'Android APK' build/Fjordwatch-debug.apk
      - name: Verify install package
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs build/Fjordwatch-debug.apk | tee build/apk-signature.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging build/Fjordwatch-debug.apk | tee build/apk-package.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Fjordwatch-Android-APK
          path: |
            build/Fjordwatch-debug.apk
            build/scene_start.png
            build/scene_battle.png
            build/apk-signature.txt
            build/apk-package.txt
          if-no-files-found: error
      - name: Save test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fjordwatch-build-logs
          path: |
            build/*.log
            build/*.png
          if-no-files-found: ignore
